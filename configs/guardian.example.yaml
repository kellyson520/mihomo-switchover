# Mihomo Guardian 的唯一行为配置。所有公网探测都必须经过 mihomo:proxy。
mihomo:
  api: http://127.0.0.1:9090
  proxy: http://127.0.0.1:7890
  secret_file: /guardian/controller_secret

groups:
  channel: CHANNEL
  main: MAIN
  backup: BACKUP-USA

# 由安装器从 proxy-groups.<name>.use 自动填充；不要手工写入订阅 URL。
providers:
  main: main-channel
  backup: backup-channel

decision:
  mode: auto
  interval: 15s
  failures_before_switch: 3
  recoveries_before_switch: 2
  min_hold: 120s
  link_loss_grace: 15s
  startup_api_timeout: 60s
  critical_quorum: 2

probes:
  - id: openai
    url: https://api.openai.com/v1/models
    critical: true
  - id: gemini
    url: https://generativelanguage.googleapis.com/v1beta/models
    critical: true
  - id: anthropic
    url: https://api.anthropic.com/v1/models
    critical: false
  - id: openrouter
    url: https://openrouter.ai/api/v1/models
    critical: false
  - id: deepseek
    url: https://api.deepseek.com/models
    critical: false

purity:
  enabled: true
  automatic_switch: false
  urls:
    - https://api.ipify.org
    - https://ipinfo.io/json

logging:
  max_bytes: 10485760
  retain: 7

reload:
  check_interval: 2s
