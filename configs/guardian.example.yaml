# Mihomo Guardian 的唯一行为配置。所有公网探测都必须经过 mihomo:proxy。
mihomo:
  api: http://127.0.0.1:9090
  proxy: http://127.0.0.1:7890
  secret_file: /guardian/controller_secret

groups:
  channel: CHANNEL
  main: MAIN
  backup: BACKUP-USA

# 由安装器从 proxy-groups.<name>.use 自动填充；不要手工写入订阅 URL。
providers:
  main: main-channel
  backup: backup-channel

# 质量扫描目标完全由用户定义；安装器只负责为每个目标准备隔离 listener/质量组。
# 首次安装默认关闭质量扫描，避免下面的占位符被误注入。复制本文件到
# guardian/guardian.yaml 后，替换 source_group、provider 和 node_filter 为实际
# mihomo 名称/正则，再将 enabled 改为 true；listener 可省略，安装器会安全回写。
quality:
  enabled: false
  full_scan_interval: 720h
  retry_interval: 24h
  order: [primary, reserve]
  targets:
    - id: primary
      source_group: YOUR_PRIMARY_GROUP
      provider: YOUR_PRIMARY_PROVIDER
      scope: locked
      lock_key: main
      listener: http://127.0.0.1:17990
    - id: reserve
      source_group: YOUR_RESERVE_GROUP
      provider: YOUR_RESERVE_PROVIDER
      scope: all
      node_filter: "YOUR_REGION_REGEX"
      listener: http://127.0.0.1:17991
  per_node_timeout: 180s
  thresholds:
    baseline_drop_points: 20
    minimum_confidence: 70
    candidate_minimum_score: 60
    recovery_margin_points: 10
    recovery_confirmations: 2
  stability:
    summary_interval: 1h
    history_window: 24h
    minimum_samples: 3
    stale_after: 26h
    good_latency_ms: 500
    bad_latency_ms: 3000
  retention:
    reports: 90
    history_days: 180

decision:
  mode: auto
  interval: 15s
  failures_before_switch: 3
  recoveries_before_switch: 2
  min_hold: 120s
  link_loss_grace: 15s
  startup_api_timeout: 60s
  critical_quorum: 2

probes:
  - id: openai
    url: https://api.openai.com/v1/models
    critical: true
  - id: gemini
    url: https://generativelanguage.googleapis.com/v1beta/models
    critical: true
  - id: anthropic
    url: https://api.anthropic.com/v1/models
    critical: false
  - id: openrouter
    url: https://openrouter.ai/api/v1/models
    critical: false
  - id: deepseek
    url: https://api.deepseek.com/models
    critical: false

purity:
  enabled: true
  automatic_switch: false
  urls:
    - https://api.ipify.org
    - https://ipinfo.io/json

logging:
  max_bytes: 10485760
  retain: 7

reload:
  check_interval: 2s
